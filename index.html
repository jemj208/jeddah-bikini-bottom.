:root{--ink:#1d1433;--sun:#ffe233}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d3b78;font-family:'Baloo Bhaijaan 2',system-ui,sans-serif;color:var(--ink);overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none}
#map{height:100%;max-width:100%;display:block;user-select:none;-webkit-user-select:none}
body.poster{overflow:hidden;background:#0d3b78}
body.poster #stage{position:static;display:block;width:2000px;height:2500px}
body.poster #map{width:2000px;height:2500px;max-width:none}
body.poster .ui{display:none!important}

/* svg text styles */
.lbl{font-family:'Baloo Bhaijaan 2';font-weight:800;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:9px;stroke-linejoin:round}
.dlbl{font-family:'Baloo Bhaijaan 2';font-weight:800;font-size:20px;fill:#3b2a66;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round;opacity:.92}
.num{font-family:'Baloo Bhaijaan 2';font-weight:800;font-size:27px;fill:var(--ink)}
.nlet{font-family:'Lalezar';font-size:48px;fill:var(--ink)}
.tiny{font-family:'Baloo Bhaijaan 2';font-weight:800;fill:#fff;paint-order:stroke;stroke:var(--ink);stroke-width:7px}
.rnum{font-family:'Baloo Bhaijaan 2';font-weight:800;font-size:27px;fill:var(--ink)}
.mtitle{font-family:'Lalezar';font-size:44px;fill:var(--sun);paint-order:stroke;stroke:var(--ink);stroke-width:8px;stroke-linejoin:round}
.msec{font-family:'Lalezar';font-size:30px;fill:#c0392b}
.mi{font-family:'Baloo Bhaijaan 2';font-weight:800;font-size:25px;fill:var(--ink)}
.ms{font-family:'Baloo Bhaijaan 2';font-weight:400;font-size:22px;fill:#7a4520}
.mk{font-family:'Baloo Bhaijaan 2';font-weight:800;font-size:22px;fill:var(--ink)}
.ttl{font-family:'Lalezar';font-size:132px;letter-spacing:2px;fill:var(--sun);paint-order:stroke;stroke:var(--ink);stroke-width:20px;stroke-linejoin:round}
.ttlsh{fill:#ff7a1a;stroke:var(--ink)}
.tsub{font-family:'Baloo Bhaijaan 2';font-weight:800;font-size:30px;fill:#145aa6;letter-spacing:.5px}
.cred{font-family:'Baloo Bhaijaan 2';font-weight:400;font-size:19px;fill:var(--ink)}
.seaname{font-family:'Lalezar';font-size:100px;fill:#dff8ff;paint-order:stroke;stroke:#0d4f94;stroke-width:12px;stroke-linejoin:round;opacity:.95}
.seasub{font-family:'Baloo Bhaijaan 2';font-weight:800;font-size:30px;fill:#fff;opacity:.9}

/* motion */
.ray{animation:ray 7s ease-in-out infinite alternate}
@keyframes ray{from{opacity:.4}to{opacity:1}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.6s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.tent{animation:tent 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
@keyframes tent{from{transform:skewX(-8deg)}to{transform:skewX(8deg)}}
.jelly{animation:jelly 4.5s ease-in-out infinite}
@keyframes jelly{0%,100%{transform:translateY(0)}50%{transform:translateY(-38px)}}
.bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-16px)}}
.swimR{animation:swimR 30s linear infinite}
@keyframes swimR{from{transform:translateX(-320px)}to{transform:translateX(2340px)}}
.swimL{animation:swimL 30s linear infinite}
@keyframes swimL{from{transform:translateX(2340px)}to{transform:translateX(-320px)}}
.bub{animation:bub 9s linear infinite}
@keyframes bub{0%{transform:translateY(0);opacity:0}12%{opacity:1}85%{opacity:.9}100%{transform:translateY(-320px);opacity:0}}
.geybub{animation:gey 2.6s linear infinite}
@keyframes gey{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-250px);opacity:0}}
.geyser{animation:gpulse 1.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes gpulse{from{transform:scaleY(.96)}to{transform:scaleY(1.03)}}
.flyfish{animation:fly 3s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translate(0,0)}50%{transform:translate(-10px,-14px)}}
.wave{animation:wave .8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 100%}
@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.rock{animation:rock 6s ease-in-out infinite alternate}
@keyframes rock{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.titlewob{transform-box:fill-box;transform-origin:50% 50%;animation:twob 3.2s ease-in-out infinite alternate}
@keyframes twob{from{transform:rotate(-1.2deg) scale(1)}to{transform:rotate(1.2deg) scale(1.02)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* interaction */
.lm,.egg,.lgi{cursor:pointer;outline:none}
.lm:hover,.lm:focus{filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 4px #ffe233)}
.egg{transition:transform .2s}
.egg:hover{filter:drop-shadow(0 0 10px #ffe233)}
.egg.found{filter:drop-shadow(0 0 14px #ffe233) drop-shadow(0 0 4px #fff)}

/* html ui */
.ui{position:fixed;z-index:5;font-family:'Baloo Bhaijaan 2';font-weight:800}
#bar{top:10px;inset-inline:10px;display:flex;gap:8px;justify-content:space-between;align-items:center;pointer-events:none}
#bar .grp{display:flex;gap:8px;pointer-events:auto}
.btn{border:4px solid var(--ink);background:var(--sun);color:var(--ink);border-radius:16px;min-width:46px;height:46px;font:800 22px 'Baloo Bhaijaan 2';padding:0 12px;box-shadow:4px 5px 0 rgba(11,42,90,.45);cursor:pointer}
.btn:active{transform:translate(2px,3px);box-shadow:2px 2px 0 rgba(11,42,90,.45)}
#hunt{background:#fff4d6;font-size:18px}
#card{bottom:14px;left:50%;transform:translateX(-50%) translateY(140%);width:min(560px,calc(100% - 24px));background:#fff4d6;border:5px solid var(--ink);border-radius:24px;padding:14px 18px 16px;box-shadow:6px 8px 0 rgba(11,42,90,.45);transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
#card.on{transform:translateX(-50%) translateY(0)}
#card h3{margin:0 0 4px;font:400 30px 'Lalezar';color:#c0392b;display:flex;gap:10px;align-items:center}
#card h3 .n{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--sun);border:4px solid var(--ink);color:var(--ink);font:800 20px 'Baloo Bhaijaan 2'}
#card p{margin:0;font-weight:400;font-size:18px;line-height:1.55}
#card .meta{margin-top:8px;font-size:14px;color:#7a4520;font-weight:400;direction:ltr;text-align:left}
#card .x{position:absolute;top:8px;right:10px;border:0;background:none;font:800 26px 'Baloo Bhaijaan 2';cursor:pointer;color:var(--ink)}
#hint{bottom:14px;left:14px;background:rgba(255,244,214,.92);border:3px solid var(--ink);border-radius:14px;padding:6px 12px;font-size:15px;font-weight:400;max-width:60vw}
</style>
</head>

const params=new URLSearchParams(location.search);
if(params.has('poster')){document.body.classList.add('poster');
  const pv=params.get('vb');if(pv)svg.setAttribute('viewBox',pv.split(',').join(' '));const pw=params.get('w');if(pw){const st=document.getElementById('stage');st.style.width=pw+'px';st.style.height=(pw*1.25)+'px';svg.style.width=pw+'px';svg.style.height=(pw*1.25)+'px';}
  const t=parseFloat(params.get('t')||'3');
  document.getAnimations().forEach(a=>{a.pause();a.currentTime=t*1000+(Math.random()*0);});
}
/* ---------- pan & zoom via viewBox ---------- */
const VB0=[0,0,2000,2500];let vb=VB0.slice();
const setVB=()=>svg.setAttribute('viewBox',vb.map(v=>v.toFixed(1)).join(' '));
function clamp(){const minW=320;vb[2]=Math.min(Math.max(vb[2],minW),2000);vb[3]=vb[2]*1.25;
  vb[0]=Math.min(Math.max(vb[0],0),2000-vb[2]);vb[1]=Math.min(Math.max(vb[1],0),2500-vb[3]);}
function zoomAt(f,cx,cy){const nx=vb[2]*f;vb[0]=cx-(cx-vb[0])*f;vb[1]=cy-(cy-vb[1])*f;vb[2]=nx;vb[3]=nx*1.25;clamp();setVB();}
function toSvg(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
svg.addEventListener('wheel',e=>{e.preventDefault();const p=toSvg(e);zoomAt(e.deltaY>0?1.15:1/1.15,p.x,p.y);},{passive:false});
const ptrs=new Map();let last=null,moved=0;
svg.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;last=null;});
svg.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const prev=ptrs.get(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const k=vb[2]/svg.getBoundingClientRect().width;
  if(ptrs.size===1){const dx=e.clientX-prev.x,dy=e.clientY-prev.y;moved+=Math.abs(dx)+Math.abs(dy);if(moved>6){if(!svg.hasPointerCapture(e.pointerId))svg.setPointerCapture(e.pointerId);vb[0]-=dx*k;vb[1]-=dy*k;clamp();setVB();}}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);moved=99;
    if(last){const m={clientX:(a.x+b.x)/2,clientY:(a.y+b.y)/2};const p=toSvg(m);zoomAt(last/d,p.x,p.y);}last=d;}});
['pointerup','pointercancel','pointerleave'].forEach(t=>svg.addEventListener(t,e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)last=null;}));
const ctr=()=>[vb[0]+vb[2]/2,vb[1]+vb[3]/2];
zin.onclick=()=>zoomAt(1/1.35,...ctr());zout.onclick=()=>zoomAt(1.35,...ctr());
zreset.onclick=()=>{vb=VB0.slice();setVB();};
function flyTo(cx,cy,w){const s=vb.slice(),e=[cx-w/2,cy-w*1.25/2,w,w*1.25];const t0=performance.now();
  (function step(t){const k=Math.min((t-t0)/650,1),q=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;vb=s.map((v,i)=>v+(e[i]-v)*q);clamp();setVB();if(k<1)requestAnimationFrame(step);})(t0);}
/* ---------- info card ---------- */
const card=document.getElementById('card');const ar=n=>String(n);
function show(n,t,p,meta){card.querySelector('.n').textContent=n;card.querySelector('.n').style.display=n?'':'none';card.querySelector('.t').textContent=t;card.querySelector('p').textContent=p;card.querySelector('.meta').textContent=meta||'';card.classList.add('on');document.getElementById('hint').style.display='none';}
card.querySelector('.x').onclick=()=>card.classList.remove('on');
function openLM(k,fly){const d=LM[k];show(d.n,d.name,d.fact,`${d.lat.toFixed(5)}°N, ${d.lon.toFixed(5)}°E · Wikipedia`);
  if(fly){const g=svg.querySelector(`.lm[data-k="${k}"]`).getBBox();flyTo(g.x+g.width/2,g.y+g.height/2,Math.max(560,g.width*2.6));}}
svg.querySelectorAll('.lm').forEach(el=>{el.addEventListener('click',e=>{if(moved>6)return;openLM(el.dataset.k,true);});el.addEventListener('keydown',e=>{if(e.key==='Enter')openLM(el.dataset.k,true);});});
svg.querySelectorAll('.lgi').forEach(el=>el.addEventListener('click',()=>{if(moved>6)return;openLM(el.dataset.k,true);}));
/* ---------- easter eggs ---------- */
const found=new Set();const total=Object.keys(EGGS).length;document.getElementById('tot').textContent=ar(total);
function egg(k){found.add(k);document.getElementById('cnt').textContent=ar(found.size);const d=EGGS[k];
  show('',`🎉 ${d.name}`,d.text,found.size===total?'You found them all! Official explorer of the Hamour\'s Floor 🐟':`${total-found.size} left`);}
svg.querySelectorAll('.egg').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();if(moved>6)return;el.classList.add('found');egg(el.dataset.e);}));
// the racing crab lives inside the circuit callout: a click on its car counts as an egg too
const crab=svg.querySelector('.lm[data-k="circuit"] g[transform]');if(crab){crab.classList.add('egg');crab.dataset.e='crab';crab.addEventListener('click',e=>{if(moved>6)return;e.stopPropagation();crab.classList.add('found');egg('crab');});}
document.getElementById('hunt').onclick=()=>{const left=Object.keys(EGGS).filter(k=>!found.has(k));
  show('','🔍 Search under the waves',left.length?`${left.length} surprises left: little creatures hiding near the landmarks, roads and coast. Tap them!`:'You found everything 👏','');};
</script>
</body>
</html>
